<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClasOfCode | Player Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-sans antialiased p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-yellow-400 tracking-wider">ClashOfCode</h1>
            <p class="text-gray-400 mt-2">Live Player Statistics</p>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Profile Card -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-xl text-gray-400 mb-4 uppercase tracking-wide">Player Profile</h2>
                <div class="text-3xl font-bold mb-2" id="player-name">Loading...</div>
                <div class="text-gray-300">Town Hall: <span id="th-level"
                        class="text-yellow-400 font-semibold">--</span></div>
                <div class="text-gray-300 mt-1">Trophies: <span id="trophies"
                        class="text-yellow-400 font-semibold">--</span></div>
            </div>

            <!-- Air Attack Readiness Card -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-xl text-gray-400 mb-4 uppercase tracking-wide">Key Levels</h2>

                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-300">Balloons</span>
                    <span id="balloon-level" class="bg-blue-600 px-3 py-1 rounded-full text-sm font-bold">--</span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-300">Eternal Tome</span>
                    <span id="tome-level" class="bg-purple-600 px-3 py-1 rounded-full text-sm font-bold">--</span>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript to load the JSON -->
    <script>
        // Fetch the local JSON file
        fetch('player_data.json')
            .then(response => response.json())
            .then(data => {
                // 1. Inject basic profile stats
                document.getElementById('player-name').innerText = data.name;
                document.getElementById('th-level').innerText = data.townHallLevel;
                document.getElementById('trophies').innerText = data.trophies;

                // 2. Find specific troops (e.g., Balloons for air attacks)
                const balloon = data.troops.find(troop => troop.name === "Balloon");
                if (balloon) {
                    document.getElementById('balloon-level').innerText = "Lvl " + balloon.level;
                }

                // 3. Find specific hero equipment (e.g., Eternal Tome)
                const tome = data.heroEquipment.find(eq => eq.name === "Eternal Tome");
                if (tome) {
                    document.getElementById('tome-level').innerText = "Lvl " + tome.level;
                }
            })
            .catch(error => console.error('Error loading JSON:', error));
    </script>
</body>

</html>
